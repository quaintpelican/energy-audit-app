<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <title>Field Energy Audit</title>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Field Energy Audit</h1>
      <p id="audit-status">No audit loaded</p>
    </div>
    <button class="secondary" id="new-audit-btn">New Audit</button>
  </header>

  <main>
    <section class="card" id="site-card">
      <div class="section-title">
        <h2>1. Site</h2>
        <span class="pill">Required</span>
      </div>
      <div class="grid">
        <label>Facility Name<input id="facilityName" placeholder="Example Hotel" /></label>
        <label>Address<input id="address" placeholder="123 Main St" /></label>
        <label>Facility Type
          <select id="facilityType">
            <option value="">Select...</option>
            <option>Office</option><option>Hotel</option><option>Retail</option>
            <option>Restaurant</option><option>Grocery</option><option>School</option>
            <option>Warehouse</option><option>Healthcare</option><option>Other</option>
          </select>
        </label>
        <label>Conditioned Area (ft²)<input id="area" type="number" inputmode="decimal" /></label>
        <label>Operating Hours / Week<input id="hoursWeek" type="number" inputmode="decimal" /></label>
        <label>Audit Date<input id="auditDate" type="date" /></label>
      </div>
      <label>General Site Notes<textarea id="siteNotes" rows="3" placeholder="Operations, occupancy, major systems, known issues..."></textarea></label>
      <button id="save-site-btn">Save Site</button>
    </section>

    <section class="card">
      <div class="section-title">
        <h2>2. Equipment</h2>
        <span id="equipment-count" class="pill">0 items</span>
      </div>
      <div class="tabs">
        <button class="tab active" data-type="HVAC">HVAC</button>
        <button class="tab" data-type="Lighting">Lighting</button>
        <button class="tab" data-type="DHW">DHW</button>
      </div>
      <div id="equipment-list" class="list"></div>
      <button id="add-equipment-btn">+ Add HVAC Equipment</button>
    </section>

    <section class="card">
      <div class="section-title">
        <h2>3. ECM Opportunities</h2>
        <span id="ecm-count" class="pill">0 ECMs</span>
      </div>
      <div id="ecm-list" class="list"></div>
      <button id="add-ecm-btn">+ Add ECM</button>
    </section>

    <section class="card">
      <h2>4. Export</h2>
      <p class="muted">Creates a structured JSON file designed for AI analysis and future ASHRAE Level 2 report generation.</p>
      <div class="actions">
        <button id="export-btn">Export Audit JSON</button>
        <button class="secondary" id="copy-prompt-btn">Copy AI Analysis Prompt</button>
      </div>
    </section>
  </main>

  <dialog id="equipment-dialog">
    <form method="dialog" id="equipment-form">
      <div class="dialog-head">
        <h3 id="equipment-dialog-title">Add Equipment</h3>
        <button class="icon secondary" value="cancel" type="submit">✕</button>
      </div>
      <input type="hidden" id="equipmentType" />
      <div id="equipment-fields" class="grid"></div>
      <label>Field Notes<textarea id="equipmentNotes" rows="3"></textarea></label>
      <label>Potential ECM Flags<input id="equipmentFlags" placeholder="VFD, schedule reduction, replacement..." /></label>
      <div class="actions">
        <button type="button" class="secondary" id="cancel-equipment">Cancel</button>
        <button type="button" id="save-equipment">Save Equipment</button>
      </div>
    </form>
  </dialog>

  <dialog id="ecm-dialog">
    <form method="dialog" id="ecm-form">
      <div class="dialog-head">
        <h3>Add ECM</h3>
        <button class="icon secondary" value="cancel" type="submit">✕</button>
      </div>
      <label>ECM Title<input id="ecmTitle" placeholder="Install VFD on AHU-1 supply fan" /></label>
      <label>Category
        <select id="ecmCategory"><option>HVAC</option><option>Lighting</option><option>DHW</option><option>Controls</option><option>Envelope</option><option>Other</option></select>
      </label>
      <label>Affected Equipment IDs<input id="ecmEquipment" placeholder="AHU-1, AHU-2" /></label>
      <label>Existing Condition<textarea id="ecmExisting" rows="2"></textarea></label>
      <label>Proposed Improvement<textarea id="ecmProposed" rows="2"></textarea></label>
      <label>Data Still Needed<textarea id="ecmMissing" rows="2" placeholder="Operating hours, measured kW, airflow..."></textarea></label>
      <label>Confidence
        <select id="ecmConfidence"><option>High</option><option selected>Medium</option><option>Low</option></select>
      </label>
      <div class="actions">
        <button type="button" class="secondary" id="cancel-ecm">Cancel</button>
        <button type="button" id="save-ecm">Save ECM</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
